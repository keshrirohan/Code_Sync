<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeSync</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #09090f;
      color: #f4f4f5;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      padding: 16px 18px 14px;
      background: linear-gradient(135deg, rgba(124,58,237,0.18) 0%, rgba(16,185,129,0.08) 100%);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      box-shadow: 0 0 18px rgba(124,58,237,0.45);
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.3px; }
    .header-text p  { font-size: 10px; color: #71717a; margin-top: 1px; }
    .version-badge {
      font-size: 9px; font-weight: 600;
      background: rgba(124,58,237,0.2);
      border: 1px solid rgba(124,58,237,0.35);
      color: #a78bfa;
      padding: 2px 7px;
      border-radius: 99px;
    }

    /* ── Status cards ── */
    .status-section {
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .status-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 9px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-ok      { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.6); }
    .dot-err     { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.5); }
    .dot-loading { background: #71717a; animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .status-info { flex: 1; min-width: 0; }
    .status-name { font-size: 10px; font-weight: 600; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.06em; }
    .status-val  { font-size: 12px; font-weight: 500; color: #e4e4e7; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-val.ok  { color: #4ade80; }
    .status-val.err { color: #f87171; }

    .last-sync-badge {
      font-size: 10px;
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.25);
      color: #a78bfa;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Auto-sync toggle ── */
    .autosync-section {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .autosync-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .autosync-info { flex: 1; }
    .autosync-title {
      font-size: 12px; font-weight: 600; color: #e4e4e7;
      display: flex; align-items: center; gap: 5px;
    }
    .autosync-sub {
      font-size: 10px; color: #52525b; margin-top: 3px;
      transition: color 0.2s;
    }
    .autosync-sub.active { color: #4ade80; }

    /* Toggle */
    .toggle { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: #27272a;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 2px; top: 2px;
      background: #52525b;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: rgba(124,58,237,0.7); border-color: #7c3aed; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: #c4b5fd; }

    .interval-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 9px;
    }
    .interval-label { font-size: 10px; color: #71717a; }
    .interval-select {
      flex: 1;
      background: #18181b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #e4e4e7;
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── Action buttons ── */
    .actions {
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .btn {
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 9px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.18s;
      letter-spacing: 0.01em;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #fff;
      box-shadow: 0 2px 12px rgba(124,58,237,0.35);
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      box-shadow: 0 4px 18px rgba(124,58,237,0.5);
      transform: translateY(-1px);
    }
    .btn-green {
      background: linear-gradient(135deg, #059669, #047857);
      color: #fff;
      box-shadow: 0 2px 10px rgba(5,150,105,0.3);
    }
    .btn-green:hover:not(:disabled) {
      box-shadow: 0 4px 16px rgba(5,150,105,0.45);
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #a1a1aa;
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.09); color: #e4e4e7; }

    /* ── Connect cookie section ── */
    .cookie-section {
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .cookie-hint {
      font-size: 10px; color: #52525b; text-align: center;
      padding: 2px 0 8px;
    }
    .cookie-hint b { color: #f87171; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 10px; left: 10px; right: 10px;
      background: #18181b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 11px;
      display: flex; align-items: center; gap: 8px;
      opacity: 0; transform: translateY(6px);
      transition: all 0.25s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: rgba(34,197,94,0.3); }
    .toast.error   { border-color: rgba(239,68,68,0.3); }

    /* ── Pulse dot ── */
    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* ── Spinner ── */
    .spinner {
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">⚡</div>
      <div class="header-text">
        <h1>CodeSync</h1>
        <p>LeetCode → GitHub</p>
      </div>
    </div>
    <span class="version-badge">v1.1</span>
  </div>

  <!-- Status cards -->
  <div class="status-section">

    <div class="status-card">
      <div class="status-dot dot-loading" id="lc-dot"></div>
      <div class="status-info">
        <div class="status-name">LeetCode Account</div>
        <div class="status-val" id="lc-val">Checking...</div>
      </div>
    </div>

    <div class="status-card">
      <div class="status-dot dot-loading" id="dash-dot"></div>
      <div class="status-info">
        <div class="status-name">Dashboard</div>
        <div class="status-val" id="dash-val">Checking...</div>
      </div>
      <span class="last-sync-badge" id="last-sync-badge" style="display:none"></span>
    </div>

  </div>

  <!-- Auto-sync toggle -->
  <div class="autosync-section">
    <div class="autosync-row">
      <div class="autosync-info">
        <div class="autosync-title">
          <span id="as-pulse"></span>
          ⚡ Auto-sync on Accept
        </div>
        <div class="autosync-sub" id="as-sub">Push to GitHub the moment LeetCode says Accepted</div>
      </div>
      <label class="toggle" style="margin-left:12px">
        <input type="checkbox" id="autosync-toggle" />
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="interval-row" id="interval-row" style="display:none">
      <span class="interval-label">Backup poll every</span>
      <select class="interval-select" id="interval-select">
        <option value="5">5 min</option>
        <option value="10" selected>10 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
      </select>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <!-- Sync Now: visible only when dashboard is reachable -->
    <button class="btn btn-green" id="sync-now-btn" disabled>
      <span id="sync-now-icon">🔄</span>
      <span id="sync-now-label">Sync Now (only new problems)</span>
    </button>

    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" id="open-btn" style="flex:1">
        🌐 Dashboard
      </button>
      <button class="btn btn-ghost" id="lc-btn" style="flex:1">
        🔗 LeetCode
      </button>
    </div>
  </div>

  <!-- Cookie section: only shown when not logged in to LeetCode -->
  <div class="cookie-section" id="cookie-section" style="display:none">
    <div class="cookie-hint"><b>⚠</b> Log in to LeetCode in your browser first, then:</div>
    <button class="btn btn-primary" id="send-btn">
      <span>🍪</span>
      <span id="send-label">Connect LeetCode Account</span>
    </button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span id="toast-icon"></span>
    <span id="toast-msg"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
