<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>CodeSync</title>
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="header-brand">
        <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span class="brand-name">CodeSync</span>
      </div>
      <div id="status-badge" class="status-badge status-loading">
        <span class="status-dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </div>

    <!-- User Info (shown when authenticated) -->
    <div id="user-section" class="user-section hidden">
      <img id="user-avatar" class="user-avatar" src="" alt="Avatar">
      <div class="user-info">
        <span id="user-name" class="user-name"></span>
        <span id="user-github" class="user-github"></span>
      </div>
    </div>

    <!-- Not Signed In (shown when not authenticated) -->
    <div id="auth-prompt" class="auth-prompt hidden">
      <div class="auth-icon">🔒</div>
      <p class="auth-text">Sign in to start syncing your LeetCode solutions to GitHub</p>
      <a id="signin-btn" class="btn btn-primary" href="#" target="_blank">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
        </svg>
        Sign in with GitHub
      </a>
    </div>

    <!-- Last Sync Card -->
    <div id="last-sync-section" class="card hidden">
      <div class="card-header">
        <span class="card-title">Last Sync</span>
        <span id="sync-status-tag" class="tag"></span>
      </div>
      <div class="sync-details">
        <div class="sync-problem">
          <span id="sync-problem-name" class="sync-problem-name"></span>
          <div class="sync-meta">
            <span id="sync-difficulty" class="difficulty-tag"></span>
            <span id="sync-language" class="lang-tag"></span>
          </div>
        </div>
        <span id="sync-time" class="sync-time"></span>
      </div>
      <a id="sync-commit-link" class="commit-link hidden" href="#" target="_blank">
        View commit on GitHub →
      </a>
    </div>

    <!-- Controls -->
    <div id="controls-section" class="controls-section hidden">
      <!-- Auto-Sync Toggle -->
      <div class="control-row">
        <div class="control-label">
          <span class="control-icon">⚡</span>
          <div>
            <span class="control-name">Auto-Sync</span>
            <span class="control-desc">Sync when solution is accepted</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="auto-sync-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Action Links -->
    <div id="links-section" class="links-section hidden">
      <a id="dashboard-link" class="link-btn" href="#" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
        Dashboard
      </a>
      <a id="settings-link" class="link-btn" href="#" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
        Settings
      </a>
      <a id="history-link" class="link-btn" href="#" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        History
      </a>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>CodeSync v1.0.0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
